[project]
name = "customer-churn-intelligence"
version = "1.0.0"
description = "Explainable Telco churn analysis and retention scenario application"
requires-python = ">=3.11,<3.13"
license = "MIT"

[tool.pytest.ini_options]
addopts = "--basetemp=.cache/pytest -p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:.*use_container_width.*:DeprecationWarning"]
